[package]
name = "frontend"
description = "Arcane Launcher — native GPUI frontend (app shell + OS glue; drives the backend crate, see MIGRATION.md)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "arcane-launcher"
path = "src/main.rs"

[dependencies]
backend = { path = "../backend" }
gpui.workspace = true
tokio.workspace = true
tokio-util.workspace = true
# Same version as gpui's image dependency — `RenderImage`/`Frame` types must
# match exactly (used for the runtime-rasterized glow-orb textures).
image = { version = "0.25.1", default-features = false }
smallvec = "1"
# Backend events are drained on the main thread through a smol channel
# (gpui's own executor flavor).
smol = "2"
serde_json = "1"
# The embedded Microsoft sign-in window (`login_host.rs`): the same
# windowing/webview stack Tauri itself sits on, without Tauri. tao runs its
# own event loop on a dedicated thread; wry embeds WebView2 / webkit2gtk.
wry = "0.57"
tao = "0.37"

[lints.rust]
unsafe_code = "forbid"
