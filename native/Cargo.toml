[workspace]
resolver = "2"
members = ["crates/arcane-core", "crates/arcane-desktop"]

[workspace.package]
version = "0.2.2"
edition = "2024"
authors = ["Arcane Launcher"]
license = "Apache-2.0"
repository = "https://github.com/Arcane-Launcher/Launcher"

[workspace.dependencies]
# Domain models / serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "process", "time", "sync", "io-util", "net", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }

# GUI
gpui = "0.2.2"
winit = "0.30"
smol = "2"

#see MIGRATION.md section 2.1 for the full crate layout rationale and
# phase gates. Every dependency added here must serve a mapped item from
# the audit in MIGRATION.md — no speculative dependencies.

[profile.release]
lto = true
codegen-units = 1
strip = true
# panic strategy intentionally left at `unwind` to match the Tauri build
